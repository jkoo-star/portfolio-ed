<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redirecionando...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #25D366;
            --green-dark: #128C7E;
            --white: #ffffff;
            --muted: #9ca3af;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--white);

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(37, 211, 102, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(18, 140, 126, 0.14),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #050505 0%,
                    #0b0f0d 50%,
                    #030303 100%
                );

            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            pointer-events: none;
        }

        .glow {
            position: fixed;

            width: 500px;
            height: 500px;

            background: rgba(37, 211, 102, 0.07);

            border-radius: 50%;
            filter: blur(100px);

            pointer-events: none;
        }

        .card {
            position: relative;

            width: min(440px, calc(100% - 32px));

            padding: 48px 40px;

            text-align: center;

            background: rgba(12, 16, 14, 0.78);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 24px;

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.04);

            animation: cardIn 0.6s ease-out;
        }

        .logo {
            width: 76px;
            height: 76px;

            margin: 0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background: linear-gradient(
                145deg,
                #25D366,
                #128C7E
            );

            box-shadow:
                0 15px 45px rgba(37, 211, 102, 0.25);

            animation: float 3s ease-in-out infinite;
        }

        .logo svg {
            width: 40px;
            height: 40px;

            fill: white;
        }

        h1 {
            font-size: 28px;
            line-height: 1.2;

            letter-spacing: -0.7px;

            margin-bottom: 12px;
        }

        .description {
            color: var(--muted);

            font-size: 15px;
            line-height: 1.6;

            margin-bottom: 32px;
        }

        .progress {
            width: 100%;
            height: 5px;

            background: rgba(255,255,255,0.07);

            border-radius: 999px;

            overflow: hidden;

            margin-bottom: 15px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;

            background: linear-gradient(
                90deg,
                #128C7E,
                #25D366
            );

            border-radius: 999px;

            animation: progress 3s linear forwards;
        }

        .status {
            color: #71717a;

            font-size: 12px;

            margin-bottom: 25px;
        }

        .manual {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 44px;

            padding: 0 20px;

            color: #d4d4d8;

            text-decoration: none;

            font-size: 13px;
            font-weight: 500;

            background: rgba(255,255,255,0.035);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 10px;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .manual:hover {
            color: white;

            background: rgba(37,211,102,0.08);

            border-color: rgba(37,211,102,0.4);

            transform: translateY(-2px);
        }

        .footer {
            margin-top: 26px;

            color: #52525b;

            font-size: 11px;
        }

        @keyframes progress {
            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 500px) {

            .card {
                padding: 40px 24px;
                border-radius: 20px;
            }

            .logo {
                width: 68px;
                height: 68px;
                border-radius: 19px;
            }

            .logo svg {
                width: 36px;
                height: 36px;
            }

            h1 {
                font-size: 25px;
            }

            .description {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="glow"></div>

    <main class="card">

        <div class="logo">

            <svg viewBox="0 0 24 24">
                <path d="M12.04 2C6.55 2 2.09 6.46 2.09 11.95c0 1.76.46 3.47 1.34 4.98L2 22l5.22-1.37a9.92 9.92 0 0 0 4.82 1.24h.01c5.49 0 9.95-4.46 9.95-9.95S17.53 2 12.04 2zm0 18.14h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.1.81.83-3.02-.2-.31a8.18 8.18 0 1 1 6.96 3.85zm4.49-6.14c-.25-.13-1.48-.73-1.71-.81-.23-.08-.4-.13-.57.13-.17.25-.65.81-.8.98-.15.17-.29.19-.54.06-.25-.13-1.04-.38-1.98-1.21-.73-.65-1.22-1.45-1.36-1.7-.14-.25-.01-.39.11-.52.11-.11.25-.29.37-.44.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.57-1.37-.78-1.88-.21-.5-.42-.43-.57-.44h-.49c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.09s.9 2.42 1.02 2.59c.13.17 1.77 2.7 4.29 3.79.6.26 1.07.42 1.44.54.61.19 1.16.16 1.6.1.49-.07 1.48-.6 1.69-1.18.21-.58.21-1.08.15-1.18-.06-.1-.23-.15-.48-.27z"/>
            </svg>

        </div>

        <h1>Estamos te redirecionando</h1>

        <p class="description">
            Você será direcionado para o nosso WhatsApp
            para continuar a conversa.
        </p>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

        <div class="status">
            Abrindo o WhatsApp...
        </div>

        <a
            class="manual"
            href="https://api.whatsapp.com/send/?phone=5562981348850&text=Oii%2C+quero+saber+mais+sobre+monetizar+meus+seguidores&type=phone_number&app_absent=0&utm_source=chatgpt.com"
        >
            Continuar manualmente →
        </a>

        <div class="footer">
            Redirecionamento seguro
        </div>

    </main>

    <script>

        const whatsappUrl =
            "https://api.whatsapp.com/send/?phone=5562981348850&text=Oii%2C+quero+saber+mais+sobre+monetizar+meus+seguidores&type=phone_number&app_absent=0&utm_source=chatgpt.com";

        setTimeout(function() {

            window.location.replace(whatsappUrl);

        }, 3000);

    </script>

</body>
</html>
